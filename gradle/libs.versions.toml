[libraries]
android-appcompat = { group = 'androidx.appcompat', name = 'appcompat', version = '1.7.1' }
android-core = { group = 'androidx.core', name = 'core-ktx', version = '1.18.0' }
android-navigation-fragment = { group = 'androidx.navigation', name = 'navigation-fragment', version.ref = 'android-navigation' }
android-navigation-ui = { group = 'androidx.navigation', name = 'navigation-ui', version.ref = 'android-navigation' }
android-room = { group = 'androidx.room', name = 'room-ktx', version.ref = 'android-room' }
android-room-compiler = { group = 'androidx.room', name = 'room-compiler', version.ref = 'android-room' }
android-test-core = { group = 'androidx.test', name = 'core-ktx', version.ref = 'android-test' }
android-test-runner = { group = 'androidx.test', name = 'runner', version.ref = 'android-test' }
apache-commons-lang = { group = 'org.apache.commons', name = 'commons-lang3', version = '3.20.0' }
apache-commons-logging = { group = 'commons-logging', name = 'commons-logging', version = '1.3.6' }
apache-commons-text = { group = 'org.apache.commons', name = 'commons-text', version = '1.15.0' }
assertk = { group = 'com.willowtreeapps.assertk', name = 'assertk', version.ref = 'assertk' }
assertk-coroutines = { group = 'com.willowtreeapps.assertk', name = 'assertk-coroutines', version.ref = 'assertk' }
bouncyCastle-providers = { group = 'org.bouncycastle', name = 'bcprov-jdk15on', version = '1.70' }
jUnit = { group = 'junit', name = 'junit', version = '4.13.2' }
jUnitParams = { group = 'pl.pragmatists', name = 'JUnitParams', version = '1.1.1' }
jspecify = { group = 'org.jspecify', name = 'jspecify', version = '1.0.0' }
kotlin-coroutines-core = { group = 'org.jetbrains.kotlinx', name = 'kotlinx-coroutines-core', version.ref = 'kotlin-coroutines' }
kotlin-coroutines-test = { group = 'org.jetbrains.kotlinx', name = 'kotlinx-coroutines-test', version.ref = 'kotlin-coroutines' }
material = { group = 'com.google.android.material', name = 'material', version = '1.13.0' }
mockK = { group = 'io.mockk', name = 'mockk-jvm', version = '1.14.11' }
robolectric = { group = 'org.robolectric', name = 'robolectric', version = '4.16.1' }
spring-security-crypto = { group = 'org.springframework.security', name = 'spring-security-crypto', version = '7.0.5' }
tomlJ = { group = 'org.tomlj', name = 'tomlj', version = '1.1.1' }

[plugins]
android-application = { id = 'com.android.application', version = '9.1.0-alpha08' }
java = { id = 'java' }
kotlin-symbolProcessor = { id = 'com.google.devtools.ksp', version = '2.3.4' }
spotless = { id = 'com.diffplug.spotless', version = '8.4.0' }
android-library = { id = "com.android.library", version = "9.1.0-alpha08" }

[versions]
android-navigation = '2.9.8'
android-room = '2.8.4'
android-sdk-min = '29'
android-sdk-target = '36'
android-test = '1.7.0'
assertk = '0.28.1'
kotlin-coroutines = '1.11.0'
